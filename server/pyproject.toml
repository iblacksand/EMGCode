[project]
name = "emgserver"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.137.1",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.49.0",
    "websockets>=16.0",
]

[project.scripts]
emgserver = "emgserver.server:start"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"
